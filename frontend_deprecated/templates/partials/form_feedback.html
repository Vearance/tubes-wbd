{{define "feedback"}}
    {{if .SessionExpired}}
    <div class="app-alert mb-4" role="status">
        Your session has expired. Please sign in again.
    </div>
    {{end}}

    {{if .Error}}
    <div class="app-alert app-alert-danger mb-4" role="alert">
        {{.Error}}
    </div>
    {{end}}
{{end}}
