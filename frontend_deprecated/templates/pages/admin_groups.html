{{define "content"}}
<main class="app-main">
    <header class="page-header"><div><p class="app-caption mb-2">Platform administration</p><h1>Groups</h1></div><a class="btn btn-primary btn-with-icon" href="/app/admin/groups/new">{{template "icon-add"}}<span>New group</span></a></header>
    {{if .Notice}}<div class="app-alert mb-4" role="status">{{.Notice}}</div>{{end}}
    <section class="app-panel p-0"><div class="table-scroll border-0"><table class="table table-hover"><thead><tr><th>Group</th><th>Members</th><th>Database access</th><th></th></tr></thead><tbody>{{range .Groups}}<tr><td><strong>{{.Name}}</strong></td><td>{{.MemberCount}}</td><td>{{.AccessCount}} databases</td><td><a class="btn btn-outline-secondary btn-sm btn-with-icon" href="/app/admin/groups/{{.ID}}"><span>Open</span>{{template "icon-arrow-right"}}</a></td></tr>{{else}}<tr><td colspan="4">No groups yet.</td></tr>{{end}}</tbody></table></div></section>
</main>
{{end}}
