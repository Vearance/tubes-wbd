{{define "public-layout"}}
<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to BScheme database management platform.">
    <meta name="theme-color" content="#0d0d0d">

    <link rel="icon" href="/static/assets/bscheme-logo.svg" type="image/svg+xml">
    <title>{{if .Title}}{{.Title}}{{else}}BScheme{{end}}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="/static/css/app.css">
    {{template "page-styles" .}}
</head>
<body>
    {{template "content" .}}
    {{template "page-scripts" .}}
</body>
</html>
{{end}}
