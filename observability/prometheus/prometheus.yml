global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bscheme-api
    metrics_path: /metrics
    static_configs:
      - targets: ["internal:8080"]
        labels:
          service: bscheme-api

  - job_name: bscheme-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]
        labels:
          service: bscheme-worker

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: rabbitmq

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888", "otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus
