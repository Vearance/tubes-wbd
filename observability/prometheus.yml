global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: bscheme-api
    metrics_path: /metrics
    static_configs:
      - targets: ["internal:8080"]
        labels:
          service: bscheme-api

  - job_name: bscheme-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]
        labels:
          service: bscheme-worker
