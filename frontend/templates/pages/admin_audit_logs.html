{{define "content"}}
<main class="app-main">
    <header class="page-header"><div><p class="app-caption mb-2">Platform administration</p><h1>Audit Logs</h1></div></header>
    {{if .Notice}}<div class="app-alert mb-4" role="status">{{.Notice}}</div>{{end}}
    <form class="app-panel admin-inline-form mb-4" method="get"><div><label class="form-label" for="actor">Actor</label><select class="form-select" id="actor" name="actor"><option value="">All actors</option><option value="admin" {{if eq .ActorFilter "admin"}}selected{{end}}>admin</option><option value="editor" {{if eq .ActorFilter "editor"}}selected{{end}}>editor</option><option value="viewer" {{if eq .ActorFilter "viewer"}}selected{{end}}>viewer</option></select></div><div><label class="form-label" for="outcome">Outcome</label><select class="form-select" id="outcome" name="outcome"><option value="">All outcomes</option><option {{if eq .OutcomeFilter "Success"}}selected{{end}}>Success</option><option {{if eq .OutcomeFilter "Failed"}}selected{{end}}>Failed</option></select></div><button class="btn btn-primary btn-with-icon" type="submit">{{template "icon-filter"}}<span>Apply</span></button></form>
    <section class="app-panel p-0"><div class="table-scroll border-0"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Outcome</th></tr></thead><tbody>{{range .AuditLogs}}<tr><td>{{.Time}}</td><td>{{.Actor}}</td><td class="cell-code">{{.Action}}</td><td class="{{.OutcomeClass}}">{{.Outcome}}</td></tr>{{else}}<tr><td colspan="4">No activity matches these filters.</td></tr>{{end}}</tbody></table></div></section>
</main>
{{end}}
