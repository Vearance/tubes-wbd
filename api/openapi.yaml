openapi: 3.0.3
info:
  title: Database Management Platform API
  version: 0.1.0
  description: HTTP API contract for the Database Management Platform.
servers:
  - url: /
tags:
  - name: system
    description: Application health and system endpoints.
  - name: authentication
    description: Login and session endpoints.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check application health
      tags:
        - system
      responses:
        '200':
          description: The application is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Create an authenticated session
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: The request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The credentials are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current session
      tags:
        - authentication
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Logout succeeded.
        '401':
          description: The session is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The CSRF token is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/ping:
    get:
      operationId: getAdminPing
      summary: Check platform admin access
      tags:
        - authentication
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The authenticated user is a platform admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '401':
          description: The session is not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The user is not a platform admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: labpro_sucks
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
        - csrf_token
        - expires_at
        - user
      properties:
        csrf_token:
          type: string
          description: Token for state-changing requests. It is not the session cookie value.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthUser'
    AuthUser:
      type: object
      required:
        - id
        - username
        - is_admin
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        is_admin:
          type: boolean
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
