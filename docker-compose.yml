name: tubes-wbd

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    environment:
      APP_PORT: ${APP_PORT:-8080}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_IDLE_TIMEOUT: ${APP_IDLE_TIMEOUT:-30m}
      APP_ABSOLUTE_LIFETIME: ${APP_ABSOLUTE_LIFETIME:-8h}
      APP_ROTATION_INTERVAL: ${APP_ROTATION_INTERVAL:-15m}
      APP_ROTATION_GRACE_PERIOD: ${APP_ROTATION_GRACE_PERIOD:-30s}
      APP_VIEWER_DEFAULT_PAGE_SIZE: ${APP_VIEWER_DEFAULT_PAGE_SIZE:-50}
      APP_VIEWER_MAX_PAGE_SIZE: ${APP_VIEWER_MAX_PAGE_SIZE:-100}
      APP_MAX_OPEN_CONNS: ${APP_MAX_OPEN_CONNS:-10}
      APP_MAX_IDLE_CONNS: ${APP_MAX_IDLE_CONNS:-5}
      APP_CONN_MAX_LIFETIME: ${APP_CONN_MAX_LIFETIME:-30m}
      APP_CONN_MAX_IDLE_TIME: ${APP_CONN_MAX_IDLE_TIME:-5m}
      APP_PING_TIMEOUT: ${APP_PING_TIMEOUT:-5s}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-10s}
      TARGET_DB_ENCRYPTION_KEY: ${TARGET_DB_ENCRYPTION_KEY}
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      platform-db:
        condition: service_healthy

  platform-db:
    image: postgres:17-alpine
    container_name: db
    environment:
      POSTGRES_DB: ${APP_NAME:-platform}
      POSTGRES_USER: ${APP_USER:-platform}
      POSTGRES_PASSWORD: ${APP_PASSWORD:-platform_password}
    ports:
      - "${APP_HOST_PORT:-5432}:5432"
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_USER:-platform} -d ${APP_NAME:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  platform-db-data:
