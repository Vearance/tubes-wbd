name: tubes-wbd

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tubes-wbd-backend
    environment:
      PORT: ${BACKEND_PORT}
      PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      platform-db:
        condition: service_healthy

  platform-db:
    image: postgres:17-alpine
    container_name: tubes-wbd-platform-db
    environment:
      POSTGRES_DB: ${PLATFORM_DB_NAME}
      POSTGRES_USER: ${PLATFORM_DB_USER}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  platform-db-data:
